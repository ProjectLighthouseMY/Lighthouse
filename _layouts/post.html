---
layout: default
---
<article class="post">
  <p class="eyebrow">Research Note</p>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%d %b %Y" }}{% if page.category %} · {{ page.category }}{% endif %}</p>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/research/' | relative_url }}">← Back to research</a></p>
</article>
